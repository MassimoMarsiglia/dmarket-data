services:
  nats:
    image: nats:latest
    restart: unless-stopped
    ports:
      - "4222:4222"

  app:
    build:
      context: ./data
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - nats
    environment:
      - NATS_URL=nats://nats:4222
    volumes:
      - ./data/bin:/app/bin:ro
